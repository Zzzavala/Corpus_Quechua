    - "Cuentan que antes aquí había una laguna."
    - "Dicen que el alcalde viajó a Lima."
    - "Parece que los niños se comieron todo el pan."
    - "Dicen que mañana habrá feria en el pueblo."
    - "Cuentan que el zorro engañó al cóndor."
    - "Dicen que tu vecino vendió su casa."
    - "Al despertar, vi que había nevado."
    - "Mi abuela contaba que antes no había carretera."
    - "Dicen que el puente se cayó con la lluvia."
    - "Parece que alguien abrió la puerta del corral."
    - "Cuentan que ese cerro tiene dueño."
    - "Dicen que la escuela nueva ya está lista."
    - "Resulta que mi hermano ya había llegado."
    - "Dicen que este año la cosecha será buena."
    - "Cuentan que un niño se perdió en el monte."
    - "Parece que la vaca se comió las flores."
    - "Dicen que en la feria venden papa barata."
    - "Cuentan que antiguamente los animales hablaban."
    - "Dicen que la profesora está de viaje."
    - "Parece que anoche cayó una helada fuerte."
    - "Dicen que mi tío ganó la carrera de caballos."
    - "Cuentan que en ese río vivía una sirena."
    - "Dicen que cortaron el agua en todo el pueblo."
    - "Parece que el gato rompió la olla."
    - "Dicen que mañana llegarán los ingenieros."

