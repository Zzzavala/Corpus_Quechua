# B01 = una consulta completa de punta a punta (§11.2), armada a mano por Claude.
# Esqueleto: frases del manual SOCEMURP y del unificado (por código original), más líneas nuevas en ESPAÑOL
# redactadas por Claude (`nuevo`), que quedan con Tipo_borrador = "redactado por Claude (solo español)" y
# Estado = Por_revisar. Nunca se redacta quechua.
#
# Caso: paciente mujer (Annel, 20 años, de Ayacucho) con dolor de barriga desde hace tres días, fiebre y vómitos.
# Cada unidad (pregunta + respuestas) va entera en el mismo sublote.

- etapa: Inicio
  unidades:
    - [{cod: QCH-1295}, {nuevo: "Buenos días, doctor.", rol: Paciente}]
    - [{cod: QCH-0001}, {cod: QCH-0002}]
    - [{cod: QCH-0011}, {cod: QCH-0012}]
    - [{cod: QCH-0015}, {cod: QCH-0016}]
    - [{cod: QCH-0019}, {cod: QCH-0020}]

- etapa: Motivo de consulta
  unidades:
    - [{cod: QCH-0025}, {cod: QCH-0008}]
    - [{cod: QCH-0033}, {nuevo: "Desde hace tres días.", rol: Paciente}]
    - [{cod: QCH-0036}, {nuevo: "Empezó de repente, después de comer.", rol: Paciente}]
    - [{cod: QCH-0028}, {cod: QCH-0029}]

- etapa: Caracterizar el síntoma
  unidades:
    - [{cod: QCH-0045}, {nuevo: "Aquí, en la boca del estómago.", rol: Paciente}]
    # (antes: «Ahora me duele más abajo, al lado derecho»: con fiebre y vómitos sería apendicitis y no cuadra con
    #  «No es nada grave» del cierre; revisión ultracode H19)
    - [{cod: QCH-0055}, {nuevo: "No se ha movido, me duele siempre en el mismo sitio.", rol: Paciente}]
    - [{cod: QCH-0149}, {nuevo: "Sí, me duele mucho.", rol: Paciente}]
    - [{cod: QCH-0064}, {nuevo: "Me duele como si me pincharan.", rol: Paciente}]
    - [{cod: QCH-0061}, {nuevo: "Sí, en la noche me duele más.", rol: Paciente}]
    - [{cod: QCH-0072}, {nuevo: "Sí, cuando como me duele más.", rol: Paciente}]
    - [{cod: QCH-0075}, {nuevo: "Tomé una pastilla, pero no se me pasó.", rol: Paciente}]

- etapa: Síntomas asociados
  unidades:
    - [{cod: QCH-0134}, {nuevo: "Sí, anoche tuve fiebre.", rol: Paciente}]
    - [{cod: QCH-0143}, {nuevo: "Sí, vomité dos veces.", rol: Paciente}]
    - [{cod: QCH-0655}, {nuevo: "No, no tengo diarrea.", rol: Paciente}]
    - [{cod: QCH-0653}, {nuevo: "No, no tengo ganas de comer.", rol: Paciente}]
    - [{cod: QCH-0667}, {nuevo: "No, no tengo tos.", rol: Paciente}]

- etapa: Examen físico
  unidades:
    - [{cod: QCH-0549}, {nuevo: "Está bien, doctor.", rol: Paciente}]
    - [{cod: QCH-0469}]
    - [{cod: QCH-0510}]
    - [{cod: QCH-0632}, {nuevo: "Sí, ahí me duele mucho.", rol: Paciente}]
    - [{cod: QCH-0102}]

- etapa: Explicación, plan y cierre
  unidades:
    - [{cod: QCH-0531}, {nuevo: "¿Es grave, doctor?", rol: Paciente}, {cod: QCH-1475}]
    - [{cod: QCH-1467}, {nuevo: "Bueno, dos pastillas en la mañana.", rol: Paciente}]
    - [{cod: QCH-0185}, {nuevo: "Sí, voy a tomar bastante agua.", rol: Paciente}]
    - [{cod: QCH-1474}, {nuevo: "Bueno, regreso en una semana.", rol: Paciente}]
    - [{nuevo: "¿Entendiste lo que tienes que hacer?", rol: Médico}, {nuevo: "Sí, entendí. Gracias, doctor.", rol: Paciente}]
