# Frases portadoras (§10.2): palabras sueltas prioritarias del léxico (síntomas, partes del cuerpo, enfermedades
# frecuentes) metidas en una frase en ESPAÑOL redactada por Claude. El quechua lo pone el traductor.
# lexico = código original de la palabra en la pestaña Lexico. Por bloque o en `sin_bloque` (quedan en el corpus
# para bloques futuros).

B03:
  - {lexico: QCH-0202, es: "Me sale sangre de la nariz.", tema: "Alarma"}
  - {lexico: QCH-1046, es: "Estoy sangrando mucho.", tema: "Alarma"}
  - {lexico: QCH-0302, es: "Tengo una herida en la pierna.", tema: "Alarma"}
