  - {lexico: QCH-0201, es: "Mi hijo tiene mucha sed y la boca seca.", tema: "Alarma"}
  - {lexico: QCH-0422, es: "Siento que me ahogo.", tema: "Alarma"}

B04:
  - {lexico: QCH-1021, es: "Me duele un diente.", tema: "Otros síntomas"}

